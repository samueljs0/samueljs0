name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contributions and render heatmap
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py

      - name: Fetch GitHub stats and render cards
        run: |
          python scripts/fetch_stats.py
          python scripts/render_stats_card.py
          python scripts/render_langs_card.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contrib-heatmap.svg data/stats.json assets/stats-card.svg assets/langs-card.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh contribution heatmap and stats cards [skip ci]"
          git push
