<svg xmlns="http://www.w3.org/2000/svg" width="490" height="300" viewBox="0 0 490 300">
  <style>
    .title { font: 700 16px 'Courier New', monospace; fill: #9fb3c8; }
    .prompt { font: 400 13px 'Courier New', monospace; fill: #6e7681; }
    .label { font: 700 13px 'Courier New', monospace; fill: #58a6ff; }
    .value { font: 400 13px 'Courier New', monospace; fill: #c9d1d9; }
  </style>
  <rect x="1" y="1" width="488" height="298" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text class="prompt" x="24" y="34">samuel@github:~$</text>
  <text class="title" x="24" y="60">whoami</text>

  <g class="row" transform="translate(24,90)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.00s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-16,90" to="24,90"
      dur="0.5s" begin="0.00s" fill="freeze"/>
    <text class="label" x="0" y="0">role</text>
    <text class="value" x="120" y="0">Full-Stack Software Developer</text>
  </g>
  <g class="row" transform="translate(24,124)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.18s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-16,124" to="24,124"
      dur="0.5s" begin="0.18s" fill="freeze"/>
    <text class="label" x="0" y="0">experience</text>
    <text class="value" x="120" y="0">+4 anos em soluções web &amp; mobile</text>
  </g>
  <g class="row" transform="translate(24,158)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.36s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-16,158" to="24,158"
      dur="0.5s" begin="0.36s" fill="freeze"/>
    <text class="label" x="0" y="0">location</text>
    <text class="value" x="120" y="0">Jaguaribe, CE - Brasil</text>
  </g>
  <g class="row" transform="translate(24,192)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.54s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-16,192" to="24,192"
      dur="0.5s" begin="0.54s" fill="freeze"/>
    <text class="label" x="0" y="0">focus</text>
    <text class="value" x="120" y="0">APIs REST, automação RPA, cloud &amp; pipelines de</text>
  </g>
  <g class="row" transform="translate(24,226)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.54s" fill="freeze"/>
    <text class="value" x="120" y="0">dados</text>
  </g>
  <g class="row" transform="translate(24,260)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.72s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-16,260" to="24,260"
      dur="0.5s" begin="0.72s" fill="freeze"/>
    <text class="label" x="0" y="0">stack</text>
    <text class="value" x="120" y="0">Python, Java, TS, Django, Spring Boot, React,</text>
  </g>
  <g class="row" transform="translate(24,294)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.72s" fill="freeze"/>
    <text class="value" x="120" y="0">AWS, Docker</text>
  </g>
  <g class="row" transform="translate(24,328)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.90s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-16,328" to="24,328"
      dur="0.5s" begin="0.90s" fill="freeze"/>
    <text class="label" x="0" y="0">status</text>
    <text class="value" x="120" y="0">Aberto a novos desafios remotos</text>
  </g>
</svg>
