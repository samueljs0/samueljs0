<svg xmlns="http://www.w3.org/2000/svg" width="430" height="224" viewBox="0 0 430 224">
  <style>
    .title { font: 700 15px 'Courier New', monospace; fill: #c9d1d9; }
    .label { font: 400 13px 'Courier New', monospace; fill: #8b949e; }
    .value { font: 700 13px 'Courier New', monospace; fill: #c9d1d9; }
    .grade { font: 700 26px 'Courier New', monospace; }
  </style>
  <rect x="1" y="1" width="428" height="222" rx="10" fill="#0d1117" stroke="#30363d"/>
