    <g transform="translate(6,-4)"><line x1="-7" y1="0" x2="-3" y2="0" stroke="#39d0d8" stroke-width="2"/><circle r="3" fill="none" stroke="#39d0d8" stroke-width="2"/><line x1="3" y1="0" x2="7" y2="0" stroke="#39d0d8" stroke-width="2"/></g>
    <text class="label" x="20" y="0">Total de commits:</text>
    <text class="value" x="268" y="0">15</text>
  </g>
  <g class="row" transform="translate(24,130)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.30s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="4,130" to="24,130"
