    <g transform="translate(6,-4)"><circle r="6" fill="none" stroke="#f85149" stroke-width="2"/><circle r="1.8" fill="#f85149"/></g>
    <text class="label" x="20" y="0">Total de issues:</text>
    <text class="value" x="268" y="0">0</text>
  </g>
  <g class="row" transform="translate(24,184)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.60s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="4,184" to="24,184"
