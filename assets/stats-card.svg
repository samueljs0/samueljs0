    <g transform="translate(6,-4)"><line x1="0" y1="-6" x2="0" y2="6" stroke="#a371f7" stroke-width="2"/><circle cy="-6" r="2.6" fill="none" stroke="#a371f7" stroke-width="2"/><circle cy="6" r="2.6" fill="#a371f7"/></g>
    <text class="label" x="20" y="0">Total de PRs:</text>
    <text class="value" x="268" y="0">0</text>
