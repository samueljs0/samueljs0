    <g transform="translate(6,-4)"><polygon points="0.00,-6.00 -1.53,-2.10 -5.71,-1.85 -2.47,0.80 -3.53,4.85 -0.00,2.60 3.53,4.85 2.47,0.80 5.71,-1.85 1.53,-2.10" fill="#e3b341"/></g>
    <text class="label" x="20" y="0">Total de estrelas:</text>
    <text class="value" x="268" y="0">0</text>
  </g>
  <g class="row" transform="translate(24,103)" opacity="0">
